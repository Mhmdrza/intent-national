name: Global Narrative Analysis

on:
  schedule:
    - cron: '0 */8 * * *'   # 8-hour job
    - cron: '0 2 * * *'     # daily AI job
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  rss_scrape:
    if: github.event.schedule == '0 */8 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install feedparser python-dateutil

      - name: Run Scraper
        run: python rss_scraper.py

      - name: Commit Changes
        run: |
          git config --global user.name 'NarrativeBot'
          git config --global user.email 'bot@github.com'
          git add data/videos.json
          git commit -m "RSS update" || echo "No changes"
      
          git pull --rebase origin main || echo "Nothing to rebase"
      
          git push


  ai_analyze_and_deploy:
    if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install openai pandas jinja2

      - name: Run AI Analyzer
        env:
          LIARA_AI_API_KEY: ${{ secrets.LIARA_AI_API_KEY }}
        run: python ai_analyzer.py

      - name: Generate UI
        run: python generate_ui.py

      - name: Commit & Push
        run: |
          git config --global user.name 'NarrativeBot'
          git config --global user.email 'bot@github.com'
          git add data/videos.json index.html
          git commit -m "AI analysis update" || echo "No changes"
      
          # Pull latest changes and rebase
          git pull --rebase origin main || echo "Nothing to rebase"
      
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
