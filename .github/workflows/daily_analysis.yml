name: Media Narrative Analyzer

on:
  schedule:
    - cron: '0 */8 * * *' 
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  analyze_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # ارتقا به v4
        
      - name: Set up Python
        uses: actions/setup-python@v5 # ارتقا به v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install feedparser requests beautifulsoup4 python-dateutil jinja2 openai pandas
          
      - name: Run Analysis
        env:
          LIARA_AI_API_KEY: ${{ secrets.LIARA_AI_API_KEY }}
        run: python analyzer.py
        
      - name: Commit and Push Data
        run: |
          git config --global user.name 'NarrativeBot'
          git config --global user.email 'bot@noreply.github.com'
          git add data/videos.json index.html || echo "No files to add"
          git commit -m "Update narrative analysis [skip ci]" || echo "No changes"
          git push
          
      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3 # ارتقا به v3 برای رفع خطا
        with:
          path: .

  deploy:
    needs: analyze_and_publish
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # ارتقا به v4
