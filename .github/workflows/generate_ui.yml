name: UI builer
on:
  schedule:
    - cron: '0 3 * * *'     # daily AI job
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build_ui_and_deploy:
    if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install dateutils jinja2
      
      - name: Generate UI
        run: python generate_ui.py

      - name: Commit & Push ui
        run: |
          git config --global user.name 'NarrativeBot'
          git config --global user.email 'bot@github.com'
          git add index.html
          git commit -m "UI update" || echo "No changes"
      
          # Pull latest changes and rebase
          git pull --rebase origin main || echo "Nothing to rebase"
      
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
